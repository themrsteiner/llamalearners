<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Llama Learners</title>
    <meta
      name="description"
      content="Llama Learners landing page. Choose the Classroom App or visit the Curriculum Store."
    />
    <link rel="stylesheet" href="/landing.css" />
  </head>
  <body>
    <main class="landing">
      <header class="brand">
        <img
          src="/public/llama-learners-logo.png"
          alt="Llama Learners logo"
          class="brand-logo"
        />
        <h1>Llama Learners</h1>
        <p>Simple tools for bright classrooms.</p>
      </header>

      <section class="portal-grid" aria-label="Llama Learners destinations">
        <a class="portal-card" href="/schedulemaker/" aria-label="Open Classroom App">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="portal-icon">
              <rect x="4" y="5.5" width="16" height="14.5" rx="2.2"></rect>
              <path d="M8 3.8v3.4M16 3.8v3.4M4 9.2h16"></path>
              <path d="M8.2 12.4h3.2M8.2 15.6h7.6"></path>
            </svg>
          </span>
          <span class="portal-title">Classroom App</span>
          <span class="portal-copy">Open the Schedule Maker experience.</span>
        </a>

        <a
          class="portal-card"
          href="https://www.teacherspayteachers.com/store/the-llama-learners"
          target="_blank"
          rel="noreferrer"
          aria-label="Open Curriculum Store"
        >
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="portal-icon">
              <path d="M5.2 8.2h13.6l-1.2 9H6.4z"></path>
              <path d="M8.8 8.2V6.7a3.2 3.2 0 1 1 6.4 0v1.5"></path>
              <circle cx="9.1" cy="18.8" r="1"></circle>
              <circle cx="14.9" cy="18.8" r="1"></circle>
            </svg>
          </span>
          <span class="portal-title">Curriculum Store</span>
          <span class="portal-copy">Visit resources on Teachers Pay Teachers.</span>
        </a>
      </section>
    </main>
    <p class="landing-build">Alpha Build 0.1.425</p>
  </body>
</html>
